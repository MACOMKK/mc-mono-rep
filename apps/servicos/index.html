<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/pwa-icons/apple-touch-icon-180x180.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HUB" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#E30613" />
    <title>MACOM HUB</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.__servicosInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', (event) => {
        event.preventDefault();
        window.__servicosInstallPrompt = event;
        window.dispatchEvent(new CustomEvent('servicos:install-prompt-ready'));
      });
      window.addEventListener('appinstalled', () => {
        window.__servicosInstallPrompt = null;
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
